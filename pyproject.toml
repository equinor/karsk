[project]
name = "karsk"
description = "Tool for building and deploying software on HPC clusters"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Zohar Malamant", email = "ZOM@equinor.com" }]
dependencies = [
  "aiofiles>=25.1.0",
  "click>=8.1.7",
  "httpx>=0.28.1",
  "networkx>=3.3",
  "pydantic>=2.9.2",
  "pytest-snapshot>=0.9.0",
  "pyyaml>=6.0.2",
  "rich>=15.0.0",
  "semver>=3.0.2",
  "six>=1.16.0",
]
dynamic = ["version"]

[project.scripts]
karsk = "karsk.cli:cli"

[project.optional-dependencies]
web = [
  "fastapi>=0.115.0",
  "htpy>=0.9.0",
  "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-mock>=3.15.1",
  "pytest-xdist>=3.5.0",
  "ruff>=0.6.8",
  "ty>=0.0.1a7",
]
docs = [
  "griffe-pydantic>=1.0",
  "mkdocstrings-python>=1.16",
  "zensical>=0.0.48",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/karsk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = true
exclude-newer = "1 week"
